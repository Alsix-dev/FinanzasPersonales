<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanzas personales</title>

    <link rel="stylesheet" href="../src/css/app.css">
    <link rel="stylesheet" href="../src/css/header.css">
    <link rel="stylesheet" href="../src/css/menu.css">
    <link rel="stylesheet" href="../src/css/main.css">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>
<body>
    <div id="app">
        <div id="root">
            <div class="contenedor">
                <header>
                    <button id="btn-Menu">
                        <span class="material-symbols-outlined">menu</span>
                        <p>Menu</p>
                    </button>

                    <div class="ttl-App">
                        <h1>Gestor de finanzas personales</h1>
                    </div>

                    <div class="usuario">
                        <button id="btn-notificacion">
                            <span class="material-symbols-outlined">notifications</span>
                        </button>

                        <div class="divider"></div>

                        <button id="cnt-usuario">
                            <span class="material-symbols-outlined">account_circle</span>
                            <div class="datos-Usuario">
                                <p class="nmbr-Usuario">Nombre de usuario</p>
                                <p class="crg-Usuario">Cargo de usuario</p>
                            </div>
                        </button>
                    </div>
                </header>

                <main>
                    <h1 class="ttl-Resumen">Resumen</h1>
                    <div class="main-estadisticas">
                        <div class="cartel-PIE cartel-Presupuesto">
                            <h2>Presupuesto</h2>
                            <p class="pie-Calculado">$xxx.xxx.xxx</p>
                            <div class="ftr-PIE">
                                <p class="mes-Calculado">en agosto</p>
                                <div class="cmbr-mes-Calculado">
                                    <button class="btn-next-Mes">
                                        <span class="material-symbols-outlined">keyboard_arrow_left</span>
                                    </button>
                                    <button class="btn-back-Mes">
                                        <span class="material-symbols-outlined">keyboard_arrow_right</span>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="cartel-PIE cartel-Ingreso">
                            <h2>Ingreso</h2>
                            <p class="pie-Calculado">$xxx.xxx.xxx</p>
                            <div class="ftr-PIE">
                                <p class="mes-Calculado">en agosto</p>
                                <div class="cmbr-mes-Calculado">
                                    <button class="btn-next-Mes">
                                        <span class="material-symbols-outlined">keyboard_arrow_left</span>
                                    </button>
                                    <button class="btn-back-Mes">
                                        <span class="material-symbols-outlined">keyboard_arrow_right</span>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="cartel-PIE cartel-Gasto">
                            <h2>Egreso</h2>
                            <p class="pie-Calculado">$xxx.xxx.xxx</p>
                            <div class="ftr-PIE">
                                <p class="mes-Calculado">en agosto</p>
                                <div class="cmbr-mes-Calculado">
                                    <button class="btn-next-Mes">
                                        <span class="material-symbols-outlined">keyboard_arrow_left</span>
                                    </button>
                                    <button class="btn-back-Mes">
                                        <span class="material-symbols-outlined">keyboard_arrow_right</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="main-movimientos">
                        <div class="movimientos-superior">
                            <h2>Movimientos recientes</h2>

                            <div class="mov-sup-Controles">
                                <div class="mov-sup-Buscar">
                                    <label>
                                        <span class="material-symbols-outlined">search</span>
                                        <input type="text" id="src-mov-input" placeholder="Buscar">
                                    </label>
                                    <button class="btn-filtrar">
                                        <p>Filtrar</p>
                                        <span class="material-symbols-outlined">filter_alt</span>
                                    </button>
                                </div>

                                <button id="btn-Add">
                                    <span class="material-symbols-outlined">add</span>
                                    <p>Añadir gasto</p>
                                </button>
                            </div>
                        </div>                     
                    </div>

                    <div class="main-sidebar"></div>

                    <div class="main-categorias"></div>
                </main>

                <footer></footer>
            </div>
        </div>
    </div>
</body>
</html>
